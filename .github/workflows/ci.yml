name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
      - run: python scripts/backtest.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx oxlint src
        working-directory: frontend

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: lodestar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the image and check both services come up
        run: |
          docker run -d --name lodestar -p 8100:8100 lodestar:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8100/api/health | grep -q '"ready":true'; then echo ready; break; fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:8100/api/health
          curl -fsS http://127.0.0.1:8100/ | grep -q "Lodestar Dispatch"
          docker logs lodestar | tail -20
          docker rm -f lodestar
